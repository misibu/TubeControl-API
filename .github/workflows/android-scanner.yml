name: Build Android Scanner APK

on:
  push:
    branches:
      - android-scanner
    paths:
      - 'android-scanner/**'
      - '.github/workflows/android-scanner.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-scanner
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android-scanner/app/build/outputs/apk/debug/app-debug.apk TubeControl-Scanner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeControl-Scanner-APK
          path: TubeControl-Scanner.apk
          if-no-files-found: error
          retention-days: 30
