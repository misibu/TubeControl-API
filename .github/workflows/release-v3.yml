name: Build and publish TubeControl v3

on:
  push:
    branches: [main]
    paths:
      - 'windows-v3/**'
      - 'android-v3/**'
      - 'scripts/patch_windows_v32.py'
      - '.github/workflows/release-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UTF-8 safe Windows UI patch
        run: python scripts/patch_windows_v32.py
      - name: Generate TubeControl icon
        shell: powershell
        working-directory: windows-v3
        run: ./generate-icon.ps1
      - name: Publish Windows x64
        working-directory: windows-v3
        run: dotnet publish TubeControl.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-v3
          path: windows-v3/publish/TubeControl-Windows-v3.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android-v3
        run: gradle --no-daemon assembleDebug
      - name: Rename Android APK
        run: cp android-v3/app/build/outputs/apk/debug/app-debug.apk TubeControl-Scanner-v3.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-v3
          path: TubeControl-Scanner-v3.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-v3
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-v3
          path: dist
      - name: Publish rolling v3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v3-latest "$GITHUB_SHA"
          git push origin refs/tags/v3-latest --force
          gh release view v3-latest >/dev/null 2>&1 || gh release create v3-latest --title "TubeControl v3 — актуальная сборка" --notes "Автоматическая актуальная сборка TubeControl v3 для Windows и Android." --prerelease
          gh release upload v3-latest dist/TubeControl-Windows-v3.exe dist/TubeControl-Scanner-v3.apk --clobber
